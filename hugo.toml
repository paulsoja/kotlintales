baseURL = "https://kotlintales.dev/"
defaultContentLanguage = "en"
title = "Kotlin Tales"
theme = "PaperMod"
enableRobotsTXT = true

[outputs]
home = ["HTML"]
section = ["HTML"]
taxonomy = ["HTML"]
term = ["HTML"]

[taxonomies]
tag = "tags"
category = "categories"

[params]
defaultTheme = "auto"
mainSections = ["posts"]
author = "Pavlo Soia"

[languages.en]
locale = "en-US"
label = "English"
weight = 1

[languages.en.params]
description = "Articles on advanced Kotlin, Android development, and software design."

[[languages.en.menus.main]]
identifier = "articles"
name = "Articles"
pageRef = "/posts"
weight = 1

[[languages.en.menus.main]]
identifier = "about"
name = "About"
pageRef = "/about"
weight = 2

[languages.ru]
locale = "ru"
label = "Русский"
weight = 2

[languages.ru.params]
description = "Статьи о возможностях Kotlin, разработке под Android и проектировании программ."

[[languages.ru.menus.main]]
identifier = "articles"
name = "Статьи"
pageRef = "/posts"
weight = 1

[[languages.ru.menus.main]]
identifier = "about"
name = "О блоге"
pageRef = "/about"
weight = 2
