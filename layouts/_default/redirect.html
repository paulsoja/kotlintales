<!DOCTYPE html>
<html lang="{{ .Language.Lang }}">
<head>
    <meta charset="UTF-8" />
    {{- $articles := site.GetPage "/posts" }}
    <title>{{ $articles.Title }} | {{ site.Title }}</title>
    <meta http-equiv="refresh" content="0; url={{ $articles.RelPermalink }}" />
    <link rel="canonical" href="{{ $articles.Permalink }}" />
</head>
<body>
<p>
    <a href="{{ $articles.RelPermalink }}">{{ $articles.Title }}</a>
</p>
</body>
</html>
